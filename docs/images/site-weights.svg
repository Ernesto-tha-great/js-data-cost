<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-labelledby="t d">
<title id="t">First-visit download size of 35 popular sites on a phone</title>
<desc id="d">Median 3.25 MB. Heaviest: Pinterest at 8.75 MB. Each bar splits JavaScript that ran during load, JavaScript that didn't, and everything else.</desc>
